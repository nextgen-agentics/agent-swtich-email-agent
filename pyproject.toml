[project]
name = "team10-email-agent"
version = "0.1.0"
description = "Team 10 Email-seat agent and harness for the AgentSwitch capstone"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "openai",
    "httpx2",
    "mcp>=2.2,<3",
    "tenacity",
    "pydantic[email]>=2",
    "pydantic-settings",
    "pyyaml",
    "python-dotenv",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
    "datamodel-code-generator",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_agent", "harness", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# One-way imports: scripts may use harness and email_agent; harness may use email_agent; the agent uses neither.
# Check with: uv run lint-imports
[tool.importlinter]
root_packages = ["email_agent", "harness", "scripts"]

[[tool.importlinter.contracts]]
name = "scripts → harness → email_agent (never back)"
type = "layers"
layers = ["scripts", "harness", "email_agent"]

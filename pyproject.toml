[project]
name = "email-agent"
version = "0.1.0"
description = "Team 10 Email-seat agent and harness for the AgentSwitch capstone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25",
    "openai>=3.19",
    "httpx2>=2.13",
    "mcp>=2.2,<3",
    "tenacity>=9.1",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
    "rich>=15.0",
    "faiss-cpu>=1.15.1",
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
    "datamodel-code-generator>=0.83",
    "import-linter>=2.15",
]
# Optional: only to send traces to a tracing tool (`uv sync --group otel`); the spans file needs nothing.
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
]

# Named commands (`uv run email-agent …`); the `python -m …` forms keep working.
[project.scripts]
email-agent = "email_agent.__main__:main"
email-watch = "email_agent.watch.watcher:main"
email-trace = "email_agent.record.telemetry:main"
email-report = "email_agent.record.run_report:main"
harness-run = "harness.run:main"
harness-score = "harness.score:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_agent", "harness", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# never collect the course's reference code or run output (with no tests/ folder yet, pytest would search everything)
norecursedirs = [".*", "reference", "runs", "harness_runs", "state", "data", "docs", "node_modules"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    # Generated by scripts/repo/gen_tool_args.py, never hand-edited.
    "email_agent/contracts/tool_args.py",
    "scripts/contracts/sweep_args.py",
]

[tool.ruff.lint]
# Pinned explicitly so a laptop and CI check the same rules a year from now: syntax and runtime
# errors, pyflakes (unused names, undefined names), whitespace warnings, and sorted imports.
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["email_agent", "harness", "scripts"]
exclude = [
    # generated
    "email_agent/contracts/tool_args\\.py$",
    "scripts/contracts/sweep_args\\.py$",
]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# faiss ships no type hints; opentelemetry is the optional `otel` group (imported only when a trace is sent)
[[tool.mypy.overrides]]
module = ["faiss", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

# One-way imports: scripts may use harness and email_agent; harness may use email_agent; the agent uses neither.
# Check with: uv run lint-imports
[tool.importlinter]
root_packages = ["email_agent", "harness", "scripts"]

[[tool.importlinter.contracts]]
name = "scripts → harness → email_agent (never back)"
type = "layers"
layers = ["scripts", "harness", "email_agent"]

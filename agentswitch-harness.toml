# Read by the AgentSwitch runner ("Our harness → Submit for a run"): how to install our project, the command it runs
# once per instance (against a fresh copy, no internet), and the file it reads afterwards.
# What the command does: docs/testing.md, "The official run".
install = "pip install uv && uv sync --frozen --no-dev"
run     = "uv run --frozen --no-sync python -m eval_harness.official --ready-only --only seat-request-suryodaya,refuse-price-not-agreed-suryodaya,seat-request-keystone,refuse-price-not-agreed-keystone"
results = "results.json"
instances = ["suryodaya", "keystone"]
timeout_minutes = 30
